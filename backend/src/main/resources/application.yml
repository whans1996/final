spring:
  application:
    name: vibenote
  config:
    # PC마다 저장소 밖 ~/.vibenote/.env를 읽는다 (#249. 비밀을 AI가 검색하는 저장소 폴더에 두지 않는다). 없으면 무시한다.
    # 옮기는 동안은 저장소 루트 .env(backend 폴더에서 실행 기준)도 읽는다. 키 단위로 합쳐지고 같은 키는 뒤에 적은 ~/.vibenote가 이긴다
    # (루트에만 있는 키는 계속 쓰인다). 순서는 EnvFileImportTest가 지킨다.
    import:
      - optional:file:../.env[.properties]
      - optional:file:${user.home}/.vibenote/.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/vibenote?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:vibenote}
    password: ${DB_PASSWORD:}
    hikari:
      # DEFAULT CURRENT_TIMESTAMP·NOW()가 Asia/Seoul 시각이 되게 연결마다 세션 시간대를 고정한다 (#17).
      # URL의 serverTimezone은 드라이버에 서버 시간대를 알려 줄 뿐 세션을 바꾸지 않아, UTC MySQL에서는 9시간 어긋난다.
      # 이름('Asia/Seoul') 대신 오프셋을 쓴다. 시간대 테이블이 빈 MySQL(Windows 설치본 등)에서도 동작하고, 한국은 서머타임이 없다.
      connection-init-sql: SET time_zone = '+09:00'
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 시드 카드 본문·예제에 MyBatis ${}·JS 템플릿 리터럴이 들어 있다. 플레이스홀더는 쓰지 않으므로 치환을 끈다.
    placeholder-replacement: false
  jackson:
    time-zone: Asia/Seoul
    default-property-inclusion: always
    factory:
      constraints:
        read:
          # JSON 요청 본문 상한 1MB (#55). 다 읽은 뒤 검사하는 @Size와 달리 읽는 도중에 멈춘다 → 413 COMMON_413.
          # Spring 매퍼를 쓰는 곳(요청 본문, LLM RestClient 응답)에만 적용되고 multipart 업로드는 위 multipart 한도를 따른다.
          # 이 값은 입력 단위(UTF-16 본문은 문자)를 세므로 JSON 요청은 common.web.JsonBodyLimitFilter가 같은 값을 바이트로 다시 센다 (#73).
          max-document-length: 1048576
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  default-produces-media-type: application/json

app:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-validity: 30m
    # Refresh 토큰: HttpOnly 쿠키 refresh_token, 재발급마다 회전 (docs/specs/F-02-login-jwt.md)
    refresh-token-validity: 14d
    refresh-cookie-secure: true
  upload-dir: ./uploads

# 분석 요청·파이프라인 (docs/specs/F-05a-analysis-request-zip.md 5절). 업로드 ZIP은 {app.upload-dir}/analysis-tmp/에 잠시 둔다.
analysis:
  daily-limit: 5
  # 인덱스 상한 (docs/specs/F-26a-index-selection.md 5.1절). 넘으면 실패시키지 않고 뒤의 파일을 버린다
  max-index-files: 2000
  max-index-bytes: 30MB
  max-file-bytes: 1MB
  max-selected-files: 30
  # 중요도 선별 (docs/specs/F-26a-index-selection.md 5.4절). 그래프 예산은 구조 탭 요청(analysis.structure)과 따로 둔다
  selection:
    max-config: 3
    max-work-steps: 50000000
    max-work-time: 10s
  # 공개 저장소 URL 수집 (docs/specs/F-05b-analysis-request-url.md 5.1절). 첫 요청은 아래 API 주소로만 하고,
  # 리다이렉트는 같은 스킴·포트의 allowed-hosts만 따라간다 (SSRF 방어)
  fetch:
    github-api-base: https://api.github.com
    gitlab-api-base: https://gitlab.com/api/v4
    allowed-hosts: [api.github.com, codeload.github.com, gitlab.com]
    github-token: ${GITHUB_TOKEN:}
    max-archive-bytes: 30MB
    connect-timeout: 5s
    timeout: 60s
    max-redirects: 3
    # 최신 커밋 조회(P-1a): 실패·시간 초과면 분석은 기본 브랜치 아카이브로 계속하고, 배지는 UNKNOWN이다
    commit-timeout: 5s
  # 프로젝트·버전 (docs/specs/P-1a-project-versions.md AC10): 새 커밋 배지 조회 결과(실패 포함)를 다시 쓰는 시간
  project:
    latest-commit-ttl: 5m
  # EXPLAINING 단계 (docs/specs/F-06-overview-explanation.md 5절): 파일 6개씩 묶어 설명, 프롬프트 입력 길이 상한
  explain:
    batch-size: 6
    max-file-chars: 6000
    overview-max-chars: 24000
    readme-max-chars: 4000
  # 실행 흐름 (docs/specs/F-07-execution-flow.md 5절): 입력 코드 합계·파일 수, 분석당 흐름 수, 저장 단계 수 상한
  flow:
    max-chars: 24000
    max-files: 8
    max-per-analysis: 3
    max-steps: 12
  # EXTRACTING 단계 (docs/specs/F-08-concept-extraction.md 5절): 프롬프트 입력 상한, 분석당 연결·새 초안 수 상한
  concept:
    catalog-max-chars: 6000
    file-list-max-chars: 6000
    max-file-chars: 3000
    max-chars: 24000
    max-links: 15
    max-drafts: 5
  # 구조 그래프 (docs/specs/F-21a-structure-graph.md 5.1·5.3절): 응답 간선·확인하지 못한 연결 상한, 요청 하나의 작업 예산, DONE 결과 캐시 수·동시 계산 수·자리 대기 시간
  structure:
    max-edges: 150
    max-unresolved: 100
    max-work-steps: 20000000
    max-work-time: 3s
    cache-size: 64
    max-concurrent: 2
    queue-timeout: 10s

# 끝난 챌린지의 미달성 참여 다시 세기 (#146, challenge.ChallengeRecountJob). Asia/Seoul 기준, "-"면 끈다
challenge:
  recount-cron: "0 10 0 * * *"

# QUIZ 단계 (docs/specs/F-14-code-quiz.md 5절): 저장할 문항 수 범위, 프롬프트 입력 상한
quiz:
  min-questions: 5
  max-questions: 10
  concept-list-max-chars: 3000
  max-file-chars: 3000
  max-chars: 24000
  # 분석 하나의 퀴즈 재생성 요청 상한 (docs/specs/L-1a-rerun-quiz-regenerate.md AC7)
  max-regenerations: 3

# LlmConfig가 provider별로 LlmClient 하나를 조립한다 (docs/specs/F-00-llm-client.md, F-27-gms-provider.md).
# mock | gms | ollama | gemini. gms는 실패(4xx·5xx·타임아웃·거부·잘림·형식 오류)하면 재시도 없이 ollama(간이 모드)로 폴백한다.
# gemini는 평가 비교용으로 폴백하지 않는다. GMS·Ollama에는 llm-schemas/<stage>.json으로 출력 형식을 강제한다.
llm:
  provider: ${LLM_PROVIDER:mock}
  gms:
    api-key: ${GMS_API_KEY:}
    base-url: ${GMS_BASE_URL:https://gms.ssafy.io/gmsapi/api.openai.com/v1}
    model: ${GMS_MODEL:gpt-4.1-mini}
    # 단계별 모델 (키는 overview|file|flow|concept|quiz|recommend, 없는 키는 기동 실패). 예: quiz: gpt-4.1 (값은 F-27b)
    stage-models: {}
    timeout: 60s
  gemini:
    api-key: ${GEMINI_API_KEY:}
    # 2026-11 무료 등급 안정 모델 (gemini-2.5-flash는 deprecated)
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
    base-url: https://generativelanguage.googleapis.com
    timeout: 60s
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:qwen2.5-coder:7b}
    timeout: 120s
    # Ollama 기본 컨텍스트(약 4K 토큰)로는 개요·묶음 프롬프트가 잘린다 (F-06 AC12)
    num-ctx: 16384
