spring:
  application:
    name: vibenote
  config:
    # 저장소 루트의 .env를 읽는다 (backend 폴더에서 실행 기준). 없으면 무시한다.
    import: optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/vibenote?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:vibenote}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Seoul
    default-property-inclusion: always
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  default-produces-media-type: application/json

app:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-validity: 30m
    # Refresh 토큰: HttpOnly 쿠키 refresh_token, 재발급마다 회전 (docs/specs/F-02-login-jwt.md)
    refresh-token-validity: 14d
    refresh-cookie-secure: true
  upload-dir: ./uploads

llm:
  provider: ${LLM_PROVIDER:mock}
