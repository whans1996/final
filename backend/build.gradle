// Spring Boot 4.1 + Java 21 (11-18 환경 최신화 결정, docs/기획서.md 결정 로그).
plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '8.11.0'
}

group = 'com.vibenote'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    mybatisVersion = '4.1.0'
    springdocVersion = '3.2.0'
    jjwtVersion = '0.13.0'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation "org.mybatis.spring.boot:mybatis-spring-boot-starter:${mybatisVersion}"
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-mysql'
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    // 구조 시각화(F-21a): Java 소스 AST. Apache 2.0·LGPL 이중 라이선스 중 Apache 2.0으로 사용
    implementation 'com.github.javaparser:javaparser-core:3.28.2'
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"
    runtimeOnly 'com.mysql:mysql-connector-j'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation "org.mybatis.spring.boot:mybatis-spring-boot-starter-test:${mybatisVersion}"
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-mysql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// @Tag("live")·@Tag("prompt-eval")은 실제 Gemini·Ollama를 부르므로 test(CI·git hook·verify)에서 뺀다 (F-00 AC9)
tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'live', 'prompt-eval'
    }
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}

// 사람이 키를 넣고 수동으로만 실행한다: ./gradlew liveTest (GMS 크레딧·Gemini 무료 한도를 쓴다)
tasks.register('liveTest', Test) {
    description = '실제 LLM 연결 확인 (@Tag("live")). 키·서버가 없으면 건너뛴다.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'live'
    }
    outputs.upToDateWhen { false }
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
        exceptionFormat 'full'
    }
}

// 프롬프트 평가 하네스 (prompt-evaluator 에이전트가 사용). 사람이 요청할 때만 실행한다 (GMS 크레딧·Gemini 무료 한도를 쓴다).
// 공급자는 LLM_PROVIDER=gms|gemini|ollama 하나만 폴백 없이 부른다 (F-27 AC13). 예: LLM_PROVIDER=gms ./gradlew promptEval ...
// ./gradlew promptEval -Pstage=overview|file|flow|concept|quiz|all -Plevel=beginner|junior|senior|all -Pfixture=DS-02-01 [-Pbatches=N] [-Pflows=3] [-PpauseMs=4000]
// 개념 카탈로그(시드 카드)를 Testcontainers DB에서 읽으므로 Docker가 필요하다 (E-1 AC2)
// 결과: ../.harness/prompt-eval/<시각>-<fixture>-<stage>.json
tasks.register('promptEval', Test) {
    description = '프롬프트를 실제 LLM(LLM_PROVIDER)으로 실행해 결과를 .harness/prompt-eval/에 저장한다 (@Tag("prompt-eval")).'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'prompt-eval'
    }
    ['stage', 'level', 'fixture', 'batches', 'flows', 'pauseMs'].each { name ->
        if (project.hasProperty(name)) {
            systemProperty "promptEval.${name}", project.property(name)
        }
    }
    outputs.upToDateWhen { false }
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
        exceptionFormat 'full'
    }
}

spotless {
    java {
        target 'src/**/*.java'
        // 버전을 고정한다. 기본 버전은 Gradle을 실행하는 JVM(로컬 JAVA_HOME 17, CI 21)에 따라 달라져 CI에서만 포맷 위반이 난다.
        // 1.29+는 실행 JVM 21이 필요하므로 JAVA_HOME 17인 PC에서도 도는 1.28.0을 쓴다.
        googleJavaFormat('1.28.0').aosp().reflowLongStrings()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}
