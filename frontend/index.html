<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>바이브노트</title>
    <!-- 첫 칠하기 전에 테마 클래스를 붙여 라이트→다크 깜빡임을 막는다. 키·규칙은 src/composables/useTheme.js와 같다 (F-29a AC5)
         지금은 FOLLOW_SYSTEM=false라 직접 고른 dark만 따른다. 다시 켤 때는 저장값이 light·dark가 아니면 matchMedia를 보게 바꾼다 -->
    <script>
      try {
        var t = localStorage.getItem('vibenote.theme')
        document.documentElement.classList.toggle('dark', t === 'dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
