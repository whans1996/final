# 바이브노트 CI — PR마다 바뀐 영역만 검증한다 (Linux 러너. 무료 플랜 private 월 2,000분 한도를 다 써서 11-26부터 저장소를 public으로 둔다).
# 아래 job 이름 5개(PR 제목 형식·하네스·변경 영역·Backend·Frontend)는 develop·main 브랜치 보호의 필수 체크다. 이름을 바꾸면 보호 설정도 함께 바꾼다.
# 로컬과 같은 검증 스크립트(scripts/verify.mjs)를 실행해 "로컬 통과 = CI 통과"가 되게 한다.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-title:
    name: PR 제목 형식
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 타입(범위) 요약 형식 검사
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if echo "$TITLE" | grep -Eq '^((feat|fix|refactor|test|wip)\((F-[0-9]{2}[a-z]?|[A-Z]{1,4}-[0-9]{1,2}[a-z0-9]{0,2}|common|harness)\)|(docs|chore)(\((F-[0-9]{2}[a-z]?|[A-Z]{1,4}-[0-9]{1,2}[a-z0-9]{0,2}|common|harness)\))?): .+'; then
            echo "OK: $TITLE"
          else
            echo "::error::PR 제목은 '타입(F-xx 또는 로드맵 ID): 요약' 형식이어야 합니다 (docs/conventions.md 6절). 현재: $TITLE"
            exit 1
          fi

  # 몇 초짜리라 경로와 관계없이 항상 돈다. 하네스(hook·스크립트)는 BE·FE 잡이 검사하지 않고,
  # 마이그레이션 번호 충돌은 두 PR이 각자 초록이어도 머지 뒤에야 드러나기 때문이다 (11-19 병렬 전환)
  harness:
    name: 하네스 스크립트·마이그레이션 번호
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_REF: ${{ github.base_ref || 'develop' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: base 브랜치 받기 (번호 비교용)
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
      - name: 스크립트 문법 검사
        run: for f in scripts/*.mjs scripts/lib/*.mjs scripts/lib/*/*.mjs .claude/hooks/*.mjs .githooks/*.mjs; do node --check "$f" || exit 1; done
      - name: 하네스 단위 테스트
        run: node --test "scripts/test/*.test.mjs"
      - name: 시드 카드 생성본이 원본과 같은지 (K-3a, data/seed → R__seed_concepts.sql)
        run: node scripts/seed-build.mjs --check
      - name: Flyway 버전 번호 (중복, base 최신 이하)
        run: node scripts/check-migrations.mjs --base "origin/${BASE_REF}"

  changes:
    name: 변경 영역 판별
    runs-on: ubuntu-latest
    outputs:
      be: ${{ steps.filter.outputs.be }}
      fe: ${{ steps.filter.outputs.fe }}
    steps:
      - uses: actions/checkout@v7
      # scripts 항목은 BE·FE job이 실제로 실행하는 파일(verify.mjs·seed-check.mjs와 import 닫힘)만 나열한다 (H-12).
      # 하네스 스크립트·hook·다른 워크플로만 바꾼 PR은 하네스 job이 검사한다. 새 import를 더하면 scripts/test/ci-filter.test.mjs가 실패한다
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            be:
              - 'backend/**'
              - 'data/seed/**'
              - 'data/datasets.json'
              - '.github/workflows/ci.yml'
              - 'scripts/verify.mjs'
              - 'scripts/lib/common.mjs'
              - 'scripts/lib/lock.mjs'
              - 'scripts/lib/related.mjs'
              - 'scripts/lib/verify.mjs'
            fe:
              - 'frontend/**'
              - 'data/seed/**'
              - 'data/datasets.json'
              # 카드 ①형식 검사의 카테고리 목록 (K-1처럼 이것만 바꾼 PR에서도 카드 검사가 돈다)
              - 'backend/src/main/java/com/vibenote/analysis/concept/ConceptCategories.java'
              - '.github/workflows/ci.yml'
              - 'scripts/verify.mjs'
              - 'scripts/lib/common.mjs'
              - 'scripts/lib/lock.mjs'
              - 'scripts/lib/related.mjs'
              - 'scripts/lib/verify.mjs'
              - 'scripts/seed-check.mjs'
              - 'scripts/lib/seed/card.mjs'
              - 'scripts/lib/seed/examples.mjs'
              - 'scripts/lib/seed/format.mjs'
              - 'scripts/test/seed-examples.test.mjs'

  backend:
    name: Backend 검증 (+ API 명세 일치)
    needs: changes
    if: needs.changes.outputs.be == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: verify be (Spotless + 테스트, Testcontainers MySQL, 시드 예제 SeedExampleTest)
        run: node scripts/verify.mjs be
      - name: openapi.json이 코드와 일치하는지 확인
        run: |
          if [ -d backend/src ]; then
            if [ -n "$(git status --porcelain -- docs/api)" ]; then
              echo "::error::docs/api/openapi.json이 현재 API와 다릅니다. 로컬에서 테스트를 돌려 갱신된 파일을 커밋하세요."
              git status --porcelain -- docs/api
              git diff --stat -- docs/api
              exit 1
            fi
          fi
      - name: 실패 로그 업로드
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-verify-logs
          path: .harness/logs
          include-hidden-files: true
          retention-days: 7

  frontend:
    name: Frontend 검증
    needs: changes
    if: needs.changes.outputs.fe == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: ${{ hashFiles('frontend/package-lock.json') != '' && 'npm' || '' }}
          cache-dependency-path: frontend/package-lock.json
          package-manager-cache: false
      - name: 의존성 설치
        run: if [ -f frontend/package-lock.json ]; then cd frontend && npm ci; fi
      # 시드 카드 ①형식·②FE 예제 검사(seed-check)와 그 단위 테스트(seed-examples)도 verify fe 안에서 돈다 (K-3a AC11)
      - name: verify fe (lint + 단위 테스트 + 빌드 + 시드 카드 검사)
        run: node scripts/verify.mjs fe
      - name: 실패 로그 업로드
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-verify-logs
          path: .harness/logs
          include-hidden-files: true
          retention-days: 7
