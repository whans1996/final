# 사람에게 가는 병렬 개발 알림 (11-19 결정): PR 열림·머지와 사람별 NOW 갱신을 Mattermost 채널로 보낸다.
# 웹훅 URL은 저장소 secret (사람이 등록, docs/환경설정.md 7절). 없으면 조용히 건너뛴다.
# Mattermost 수신 웹훅은 웹훅을 만든 사람 이름으로 글을 올린다(서버가 username 바꾸기를 무시). 그래서 사람마다 자기 웹훅
# MATTERMOST_WEBHOOK_URL_DH·_JS를 두고, 이벤트를 일으킨 사람(sender)의 웹훅으로 보낸다 (11-19, 김준섭 활동이 김동환 이름으로 오던 문제).
# 그 사람의 웹훅이 없으면 공용 MATTERMOST_WEBHOOK_URL, 그것도 없으면 등록된 아무 웹훅으로 보낸다.
name: Notify

on:
  pull_request:
    branches: [develop, main]
    types: [opened, reopened, ready_for_review, closed]
  push:
    branches: ['feature/**']
    paths: ['docs/handoff/NOW-*.md']

permissions:
  contents: read

jobs:
  mattermost:
    name: Mattermost 알림
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      WEBHOOK_SHARED: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
      WEBHOOK_DH: ${{ secrets.MATTERMOST_WEBHOOK_URL_DH }}
      WEBHOOK_JS: ${{ secrets.MATTERMOST_WEBHOOK_URL_JS }}
      WEBHOOK: ${{ secrets.MATTERMOST_WEBHOOK_URL || secrets.MATTERMOST_WEBHOOK_URL_DH || secrets.MATTERMOST_WEBHOOK_URL_JS }}
    steps:
      - name: 웹훅 미설정이면 건너뜀
        if: env.WEBHOOK == ''
        run: echo "MATTERMOST_WEBHOOK_URL(_DH·_JS) secret이 없어 알림을 건너뜁니다"
      - uses: actions/checkout@v7
        if: env.WEBHOOK != ''
        with:
          # push payload에 커밋별 변경 파일이 없어 커밋 id로 git show 한다 (이번 push의 커밋이 모두 필요)
          fetch-depth: 0
      - uses: actions/setup-node@v7
        if: env.WEBHOOK != ''
        with:
          node-version: 24
          package-manager-cache: false
      - name: 메시지 만들어 보내기
        if: env.WEBHOOK != ''
        # 알림 실패(Mattermost 장애, URL 만료)가 PR 체크를 빨간불로 만들지 않게 한다 ("CI 초록이면 머지" 판정과 분리)
        continue-on-error: true
        run: |
          node scripts/notify-message.mjs > payload.json
          WHO=$(node scripts/notify-message.mjs --sender)
          case "$WHO" in
            dh) URL="${WEBHOOK_DH:-${WEBHOOK_SHARED:-$WEBHOOK}}" ;;
            js) URL="${WEBHOOK_JS:-${WEBHOOK_SHARED:-$WEBHOOK}}" ;;
            *) URL="${WEBHOOK_SHARED:-$WEBHOOK}" ;;
          esac
          if [ -s payload.json ]; then
            echo "보낸 사람: ${WHO:-알 수 없음}"
            curl -sS --fail -X POST -H 'Content-Type: application/json' --data @payload.json "$URL"
          else
            echo "알릴 내용 없음"
          fi
