# 사람에게 가는 병렬 개발 알림 (11-19 결정): PR 열림·머지와 사람별 NOW 갱신을 Mattermost 채널로 보낸다.
# 웹훅 URL은 저장소 secret MATTERMOST_WEBHOOK_URL (사람이 등록, docs/환경설정.md 7절). 없으면 조용히 건너뛴다.
name: Notify

on:
  pull_request:
    branches: [develop, main]
    types: [opened, reopened, ready_for_review, closed]
  push:
    branches: ['feature/**']
    paths: ['docs/handoff/NOW-*.md']

permissions:
  contents: read

jobs:
  mattermost:
    name: Mattermost 알림
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      WEBHOOK: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
    steps:
      - name: 웹훅 미설정이면 건너뜀
        if: env.WEBHOOK == ''
        run: echo "MATTERMOST_WEBHOOK_URL secret이 없어 알림을 건너뜁니다"
      - uses: actions/checkout@v7
        if: env.WEBHOOK != ''
      - uses: actions/setup-node@v7
        if: env.WEBHOOK != ''
        with:
          node-version: 24
          package-manager-cache: false
      - name: 메시지 만들어 보내기
        if: env.WEBHOOK != ''
        run: |
          node scripts/notify-message.mjs > payload.json
          if [ -s payload.json ]; then
            curl -sS --fail -X POST -H 'Content-Type: application/json' --data @payload.json "$WEBHOOK"
          else
            echo "알릴 내용 없음"
          fi
