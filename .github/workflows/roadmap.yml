# 로드맵 넘겨주는 시점 알림 (R-1, docs/기획서.md 7.7절): 날짜가 지났는데 그 항목이 끝나지 않았으면(✅ 아님) Mattermost로 한 번 알린다.
# schedule은 기본 브랜치(main, 제출 때만 갱신)의 워크플로만 돌아 쓸 수 없다. 그래서 develop push(= PR 머지) 때 돈다.
# "한 번": 직전 develop 끝 커밋 날 ≤ 넘겨주는 날 < 오늘인 것만 알린다 → 그 시점이 지난 뒤 첫 develop push에서만 나간다 (상태 파일 없음).
# 상태는 scripts/lib/roadmap.mjs가 PR 본문의 `Roadmap: <ID>` 줄로 계산한다. 웹훅이 없으면 조용히 건너뛴다 (notify.yml과 같은 secret).
name: Roadmap

on:
  push:
    branches: [develop]

permissions:
  contents: read
  pull-requests: read

jobs:
  overdue:
    name: 넘겨주는 시점 지남 알림
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      WEBHOOK: ${{ secrets.MATTERMOST_WEBHOOK_URL || secrets.MATTERMOST_WEBHOOK_URL_DH || secrets.MATTERMOST_WEBHOOK_URL_JS }}
    steps:
      - name: 웹훅 미설정이면 건너뜀
        if: env.WEBHOOK == ''
        run: echo "MATTERMOST_WEBHOOK_URL(_DH·_JS) secret이 없어 알림을 건너뜁니다"
      - uses: actions/checkout@v7
        if: env.WEBHOOK != ''
        with:
          # 직전 develop 끝 커밋(before)의 날짜를 읽는다
          fetch-depth: 0
      - uses: actions/setup-node@v7
        if: env.WEBHOOK != ''
        with:
          node-version: 24
          package-manager-cache: false
      - name: 메시지 만들어 보내기
        if: env.WEBHOOK != ''
        # 알림 실패가 develop 상태를 빨간불로 만들지 않게 한다
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          node scripts/roadmap.mjs --overdue-since "$BEFORE" > payload.json
          if [ -s payload.json ]; then
            curl -sS --fail -X POST -H 'Content-Type: application/json' --data @payload.json "$WEBHOOK"
          else
            echo "새로 지난 넘겨주는 시점 없음"
          fi
